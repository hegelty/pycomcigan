name: Parser Health

on:
  schedule:
    # Asia/Seoul 00:00, 06:00, 12:00, 18:00 (UTC+9).
    - cron: '0 3,9,15,21 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parser-health-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: python -m pip install poetry==2.1.3
      - name: Install locked dependencies and project
        run: poetry install --no-interaction
      - name: Run offline regression tests
        run: poetry run python -W error -m pytest -q
      - name: Check live server responses
        env:
          PYTHONUNBUFFERED: '1'
        run: poetry run python -m scripts.check_live_parser
